# Local Neo4j for Ekte Mat Online (Oblig 5). Passwords come from .env (never committed).
#   docker compose up -d            start both databases
#   docker compose stop             stop them (data in neo4j-dev is kept)
# Neo4j Browser: http://localhost:7474 (dev) and http://localhost:7475 (test), user "neo4j".
# Both are bound to 127.0.0.1 only, so they are not reachable from the network.

x-neo4j: &neo4j
  image: neo4j:5.26-community
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 10s

services:
  neo4j-dev:
    <<: *neo4j
    container_name: ektemat-neo4j-dev
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser
      - "127.0.0.1:7687:7687"   # Bolt (the app)
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-dev-data:/data

  # Throw-away database for the test suite. Tests wipe it before every test.
  neo4j-test:
    <<: *neo4j
    container_name: ektemat-neo4j-test
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_TEST_PASSWORD:?Set NEO4J_TEST_PASSWORD in .env}"
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m

volumes:
  neo4j-dev-data:
